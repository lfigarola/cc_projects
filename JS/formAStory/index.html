<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans" rel="stylesheet">
    <title>Form a Story</title>
</head>

<body>
    <section id="top">
        <img src="https://content.codecademy.com/courses/learn-html-forms/formAStoryLogo.svg" alt="Form A Story Logo">
    </section>

    <section id="main">
        <h1>Complete the Form -<br> Complete the Story!</h1>
        <hr>
        <!--Add your form below:-->
        <form action="story.html" method="GET"> <!-- sending information to story.html using a GET request-->
            
            <label for="animal-1">Animal:</label> 
            <input type="text" id="animal-1" name="animal-1" required value="Wrabbit">
            <br>

            <label for="animal-2"> Another animal:</label>
            <input type="text" id="animal-2" name="animal-2" required value="Burtle">
            <br>

            <label for="animal-3">One more animal:</label>
            <input type="text" id="animal-3" name="animal-3" required value="Snorse">
            <br>

            <label for="adj-1">Adjective (ends in -ed):</label>
            <input type="text" id="adj-1" name="adj-1" required value="stunned">
            <br>

            <label for="verb-1">Verb (ends in -ing):</label>
            <input type="text" id="verb-1" name="verb-1" required value="jamming">
            <br>

            <label for="num-1">Number:</label>
            <input type="number" id="num-1" name="num-1" required value="4">
            <br>

            <span>Yes or No:</span>
            <input type="radio" name="answer" id="yes" value="yes" required>
            <label for="yes">Yes</label>
            <input type="radio" name="answer" id="no" value="no">
            <label for="no">No</label>
            <br>

            <label for="speed">Relative speed (ends in -er):</label>
            <select name="speed" id="speed" required>
                <option value="faster">Faster</option>
                <option value="slower">Slower</option>
            </select>
            <br>

            <label for="quote">Motivational Quote:</label>
            <input type="text" name="quote" id="quote" required list="quote-choices">
            <datalist id="quote-choices">
                <option value="The early bird gets the worm."></option>
                <option value="The pen is mightier than the sword."></option>
                <option value="Fortune favors the bold."></option>
                <option value="winner gets ice cream!"></option>
            </datalist>
            <br>

            <label for="message">Meaningful Message:</label>
            <textarea name="message" id="message" required rows="8" cols="40">More knows the devil for old than for devil.</textarea>
            <br>

            <input type="submit" value="Form My Story!">
        </form>
    </section>
</body>

</html>
